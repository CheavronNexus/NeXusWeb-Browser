name: Build & Package NeXusWeb V6

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build & Package Windows x64 Setup
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'Stable V6.5.0/package-lock.json'

      - name: Install Dependencies
        working-directory: 'Stable V6.5.0'
        run: npm ci

      - name: Build Vite & Package Standalone Binary
        working-directory: 'Stable V6.5.0'
        run: npm run build:setup

      - name: Upload Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeXusWeb-Setup-v6.5.0
          path: 'Stable V6.5.0/dist-electron/NeXusWeb-Setup-v6.5.0.exe'
